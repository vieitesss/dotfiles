set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

# Reload tmux config
unbind r
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded (plugins sourced)'


# Configs
set -g history-limit 100000
set-window-option -g mode-keys vi
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features "*:RGB"
set -g base-index 1
set -g renumber-windows on
# set -g extended-keys on
# set -g extended-keys-format csi-u
setw -g mouse on

# Copy through nested tmux (e.g. rp proxy sessions) with OSC 52: accept
# clipboard requests from inner programs, and let an inner tmux (whose terminal
# is tmux-256color) send them out.
set -s set-clipboard on
set -as terminal-features ',tmux-256color:clipboard'

set -g status on
set -g status-left "#{host_short} · [#S] "
set -g status-right ""
set -g status-justify left
set -g status-left-length 80
set -g status-interval 1

# set -g status-position top
# set-window-option -g window-status-format "#{window_index}:#{window_name}"
# set-window-option -g window-status-current-format "#{window_index}:#{window_name}#{?window_zoomed_flag,,}"
# set-window-option -g window-status-current-style fg="#dc8a78"

# Panes & Windows
unbind w
unbind %
bind _ split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind C-\\

# Move between panes
bind-key , prev
bind-key . next

# Move between panes
bind-key j select-pane -D
bind-key k select-pane -U
bind-key h select-pane -L
bind-key l select-pane -R

# Resize panes
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 10
bind-key -r L resize-pane -R 10

# Maximize pane
bind-key m resize-pane -Z

# 'v' to begin selection in copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'Space' send -X clear-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe "pbcopy"

# Personal key-bindings (nexo bindings live after the plugins, below)
bind-key p display-popup -E -e TERM=tmux-256color -w 80% -h 80% -d "#{pane_current_path}"


# No delay for escape key press
set -s escape-time 0

##### Plugins ##################################################################
# Add plugins as "owner/repo" — cloned from GitHub on first load.
# To remove a plugin: delete its line and rm -rf ~/.tmux/plugins/<name>
run-shell '
# POSIX sh only (tmux run-shell uses /bin/sh, which is dash on Linux)
PLUGINS="
vieitesss/gruber-darker-tmux-theme
"
PLUGDIR="$HOME/.tmux/plugins"
mkdir -p "$PLUGDIR"
for repo in $PLUGINS; do
  name="${repo##*/}"
  dir="$PLUGDIR/$name"
  [ -d "$dir" ] || git clone --depth=1 "https://github.com/$repo" "$dir"
  # # Plugin bootstrap file name may not match the repo name; take the first *.tmux.
  # for f in "$dir"/*.tmux; do
  #   [ -f "$f" ] || continue
  #   # Script-style plugins (shebang) are executed; config-style are sourced.
  #   if head -1 "$f" | grep -q "^#!"; then "$f"; else tmux source-file "$f"; fi
  #   break
  # done
done
exit 0
'

# plugins
set -g @yank_with_mouse off

# nexo: agent focus hooks, watcher, window highlight and glance row. Skipped
# where nexo isn't installed. Glance is re-applied on every reload because
# `set -g status on` above would otherwise hide its row.
if-shell 'command -v nexo >/dev/null 2>&1' {
  run-shell "nexo tmux init --backend=tmux"
  run-shell "nexo --backend=tmux tmux glance on"
}

# nexo key bindings (nexo installs none itself). run-shell does not inherit
# TMUX_PANE, so the bindings that need the current pane pass it explicitly.
bind-key a display-popup -E -B -w 100% -h 100% "nexo tui agents"
bind-key o display-popup -E -B -w 100% -h 100% "nexo tui projects"
bind-key A run-shell "nexo --backend=tmux tmux glance toggle"
bind-key n run-shell "TMUX_PANE=#{pane_id} nexo --backend=tmux previous"
bind-key -n M-o run-shell "TMUX_PANE=#{pane_id} nexo --backend=tmux remote previous"
bind-key -n C-v run-shell "TMUX_PANE=#{pane_id} nexo --backend=tmux remote paste C-v"

# Source the theme palette (dark or light) for the current mode.
# Prefer an explicit mode supplied by system-appearance; fall back to macOS
# when tmux is started or reloaded manually. Linux has no appearance setting,
# so use the mode system-appearance last pushed over SSH, or dark.
# Only the light theme sets cursor and pane colours; clear them so a switch
# back to dark does not keep the light values.
set -gwu cursor-colour
set -gwu pane-colours
if-shell 'mode="#{SYSTEM_APPEARANCE}"; if [ -z "$mode" ]; then if command -v defaults >/dev/null 2>&1; then [ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" = Dark ] && mode=dark; else mode=$(cat ~/.local/state/system-appearance 2>/dev/null || echo dark); fi; fi; [ "$mode" = dark ]' \
    'source-file ~/.tmux/plugins/gruber-darker-tmux-theme/gruber-darker-tmux-theme.tmux' \
    'source-file ~/.tmux/plugins/gruber-darker-tmux-theme/gruber-lighter-tmux-theme.tmux'

# The theme plugin paints pane backgrounds opaque, which hides the
# terminal's transparency. Revert to the default background (keep its fg).
set -g window-style "fg=#{@color_comment},bg=default"
set -g window-active-style "fg=#{@color_fg},bg=default"
set -g status-style "fg=#{@color_fg},bg=default"
set-window-option -g window-status-style "fg=#{@color_comment},bg=default"
set-window-option -g window-status-current-style "fg=#{@color_accent},bg=default,bold"
