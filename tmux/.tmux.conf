set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

# Reload tmux config
unbind r
bind r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded (plugins sourced)'


# Configs
set -g history-limit 100000
set-window-option -g mode-keys vi
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features "*:RGB"
set -g base-index 1
set -g renumber-windows on
# set -g extended-keys on
# set -g extended-keys-format csi-u
setw -g mouse on

# Copy through nested tmux (e.g. rp proxy sessions) with OSC 52: accept
# clipboard requests from inner programs, and let an inner tmux (whose terminal
# is tmux-256color) send them out.
set -s set-clipboard on
set -as terminal-features ',tmux-256color:clipboard'

set -g status on
set -g status-left "#{host_short} · [#S] "
set -g status-right ""
set -g status-justify left
set -g status-left-length 80
set -g status-interval 1

set -g @rp_hosts 'vieitesrpi'
run-shell ~/personal/rp/remote-proxy.tmux

# set -g status-position top
# set-window-option -g window-status-format "#{window_index}:#{window_name}"
# set-window-option -g window-status-current-format "#{window_index}:#{window_name}#{?window_zoomed_flag,,}"
# set-window-option -g window-status-current-style fg="#dc8a78"

# Panes & Windows
unbind w
unbind %
bind _ split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind C-\\

# Move between panes
bind-key , prev
bind-key . next

# Change between workspaces
unbind n
bind-key n switch-client -l

# Move between panes
bind-key j select-pane -D
bind-key k select-pane -U
bind-key h select-pane -L
bind-key l select-pane -R

# Resize panes
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 10
bind-key -r L resize-pane -R 10

# Maximize pane
bind-key m resize-pane -Z

# 'v' to begin selection in copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'Space' send -X clear-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe "pbcopy"

# Personal key-bindings
bind-key o run-shell "tmux neww 'contx --multiplexer tmux'"
bind-key p display-popup -E -e TERM=tmux-256color -w 80% -h 80% -d "#{pane_current_path}"


# No delay for escape key press
set -s escape-time 0

##### Plugins ##################################################################
# Add plugins as "owner/repo" — cloned from GitHub on first load.
# To remove a plugin: delete its line and rm -rf ~/.tmux/plugins/<name>
run-shell '
# POSIX sh only (tmux run-shell uses /bin/sh, which is dash on Linux)
PLUGINS="
vieitesss/gruber-darker-tmux-theme
vieitesss/agent-radar
"
PLUGDIR="$HOME/.tmux/plugins"
mkdir -p "$PLUGDIR"
for repo in $PLUGINS; do
  name="${repo##*/}"
  dir="$PLUGDIR/$name"
  [ -d "$dir" ] || git clone --depth=1 "https://github.com/$repo" "$dir"
  # # Plugin bootstrap file name may not match the repo name; take the first *.tmux.
  # for f in "$dir"/*.tmux; do
  #   [ -f "$f" ] || continue
  #   # Script-style plugins (shebang) are executed; config-style are sourced.
  #   if head -1 "$f" | grep -q "^#!"; then "$f"; else tmux source-file "$f"; fi
  #   break
  # done
done
exit 0
'

# plugins
set -g @yank_with_mouse off
set -g @agent-radar-glance-fields 'dot,session,branch'
run-shell ~/.tmux/plugins/agent-radar/agent-radar.tmux

# Source the theme palette (dark or light) for the current mode.
# Prefer an explicit mode supplied by system-appearance; fall back to macOS
# when tmux is started or reloaded manually, and to dark where macOS
# appearance is unavailable (Linux).
if-shell 'test "#{SYSTEM_APPEARANCE}" = dark || { test -z "#{SYSTEM_APPEARANCE}" && { ! command -v defaults >/dev/null 2>&1 || test "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" = Dark; }; }' \
    'source-file ~/.tmux/plugins/gruber-darker-tmux-theme/gruber-darker-tmux-theme.tmux' \
    'source-file ~/.tmux/plugins/gruber-darker-tmux-theme/gruber-lighter-tmux-theme.tmux'

# The theme plugin paints pane backgrounds opaque, which hides the
# terminal's transparency. Revert to the default background (keep its fg).
set -g window-style "fg=#{@color_comment},bg=default"
set -g window-active-style "fg=#{@color_fg},bg=default"
set -g status-style "fg=#{@color_fg},bg=default"
set-window-option -g window-status-style "fg=#{@color_comment},bg=default"
set-window-option -g window-status-current-style "fg=#{@color_accent},bg=default,bold"
